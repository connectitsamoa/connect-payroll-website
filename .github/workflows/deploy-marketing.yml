name: Deploy Connect Payroll website to Azure

on:
  push:
    branches:
      - main
    paths:
      - marketing/**
      - .github/workflows/deploy-marketing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-payroll-public-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish website to Azure Static Web Apps
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate static website content
        shell: bash
        run: |
          set -euo pipefail
          test -f marketing/index.html
          test -f marketing/privacy.html
          test -f marketing/terms.html
          test -f marketing/security.html
          test -f marketing/support.html
          test -f marketing/styles.css
          test -f marketing/staticwebapp.config.json
          if find marketing -type l -print -quit | grep -q .; then
            echo "The website artifact must not contain symbolic links." >&2
            exit 1
          fi

      - name: Deploy reviewed static files
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch, pinned 2024-09-11
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /marketing
          output_location: ""
          skip_app_build: true
